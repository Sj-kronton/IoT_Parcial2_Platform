<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Analisis con IA - IoT Campus UNAB</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#0f172a;color:#e2e8f0}
 header{display:flex;gap:16px;align-items:center;padding:12px 20px;background:#1e293b}
 header h1{font-size:18px;margin:0;flex:1} a{color:#7dd3fc}
 main{max-width:900px;margin:0 auto;padding:16px}
 .bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
 select,button{background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:7px 10px;font-size:14px}
 button{background:#2563eb;border:0;cursor:pointer} button:disabled{opacity:.5}
 #out{white-space:pre-wrap;background:#1e293b;border-radius:10px;padding:16px;line-height:1.5;min-height:120px}
 .h{background:#1e293b;border-radius:8px;padding:8px 12px;margin:6px 0;cursor:pointer;font-size:13px}
 .h:hover{background:#334155}
</style></head><body>
<header><h1>Analisis de graficas con IA</h1><a href="/">Panel</a> <a href="/grafana/">Grafana</a></header>
<main>
<div class="bar">
 <select id="dev"></select>
 <select id="hrs"><option value="1">ultima hora</option><option value="6">6 horas</option>
  <option value="24" selected>24 horas</option><option value="72">3 dias</option>
  <option value="144">6 dias</option></select>
 <button id="go">Analizar con IA</button>
</div>
<div id="out">Elige un dispositivo y un periodo.</div>
<h3>Historial guardado</h3><div id="hist"></div>
</main>
<script>
const TOKEN = sessionStorage.getItem('tk') || prompt('Token del panel');
sessionStorage.setItem('tk', TOKEN || '');
const H = {'X-Token': TOKEN, 'Content-Type': 'application/json'};
const out = document.getElementById('out'), dev = document.getElementById('dev');
async function init() {
  const ds = await (await fetch('/api/devices', {headers: H})).json();
  dev.innerHTML = '<option value="ALL">ALL (resumen general)</option>' + ds.map(d => `<option>${d.id}</option>`).join('');
  hist();
}
async function hist() {
  const hs = await (await fetch('/api/analysis/history', {headers: H})).json();
  const box = document.getElementById('hist'); box.innerHTML = '';
  hs.forEach(h => {
    const e = document.createElement('div'); e.className = 'h';
    e.textContent = `#${h.id} | ${h.device_id} | ${h.hours} h | ${h.time.slice(0,16).replace('T',' ')}`;
    e.onclick = () => out.textContent = h.result;
    box.appendChild(e);
  });
}
document.getElementById('go').onclick = async ev => {
  const b = ev.target; b.disabled = true; out.textContent = 'Analizando... puede tardar hasta un minuto.';
  try {
    const r = await fetch('/api/analysis', {method: 'POST', headers: H,
      body: JSON.stringify({device_id: dev.value, hours: Number(document.getElementById('hrs').value)})});
    const j = await r.json();
    out.textContent = r.ok ? j.text : 'Error: ' + (j.detail || r.status);
    hist();
  } catch (e) { out.textContent = 'Error de conexion'; }
  b.disabled = false;
};
init();
</script></body></html>
